[package]
name = "file-agent"
version = "0.1.0"
edition = "2021"
authors = ["Kuntur Agent <agent@kuntur.dev>"]
description = "Agente de Rust para analizar archivos y enviarlos a una API REST para clasificación"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"
bytes = "1.5"
